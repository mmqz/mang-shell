# mang-app 独立于 bidcore workspace（桌面壳与核心库分开构建，避免拖慢核心 CI）
[workspace]

[package]
name = "mang-app"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "标书桌面壳（过渡方案）：tao + wry WebView + 直链 bidcore"

[dependencies]
tao = "0.37"
wry = "0.57"
# 直链 bidcore（方案 A：不经 MCP 层）
bid-domain = { path = "../bid-domain" }
bid-tools = { path = "../bid-tools" }
serde_json = "1"
# 系统文件对话框（同步 API，主线程调用）。关闭默认的 xdg-portal/wayland，
# Windows 只用 Win32 COM（IFileOpenDialog），不会引入 Linux 依赖。
rfd = { version = "0.17", default-features = false }

# DnD（WM_DROPFILES 子类化）与 explorer /select。windows crate 版本与 tao 0.37/wry 0.57
# 保持同一条锁（0.62.x），不新增版本号。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
] }

[build-dependencies]